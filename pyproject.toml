[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "weaklink-modem"
version = "1.0.0"
description = "MFSK modem with a C++ backend: bytes in, audio out, bytes back"
readme = "README-pypi.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/ivica3730k/weaklink-modem-cpp"
Source = "https://github.com/ivica3730k/weaklink-modem-cpp"

[tool.scikit-build]
minimum-version = "0.8"
# Development.Module, which python/CMakeLists.txt uses, needs 3.18. A source
# install finding an older CMake would configure and then fail.
cmake.version = ">=3.18"
wheel.packages = ["python/weaklink"]
# Only the extension module; see python/CMakeLists.txt for what this keeps out.
install.components = ["python"]
# The CLI, the benchmark and the Catch2 suite are no part of a wheel.
cmake.define.WEAKLINK_PYTHON = "ON"
cmake.define.WEAKLINK_BUILD_APPS = "OFF"
cmake.define.WEAKLINK_BUILD_TESTS = "OFF"
cmake.define.WEAKLINK_INSTALL = "OFF"
cmake.define.WEAKLINK_LIVE_AUDIO = "ON"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests/python -q"

[tool.cibuildwheel.linux]
# PortAudio needs ALSA headers to build its backend. The runtime library is
# dlopen'd rather than linked, so the wheel still starts on a box without it.
before-all = "yum install -y alsa-lib-devel || { apt-get update && apt-get install -y libasound2-dev; }"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
